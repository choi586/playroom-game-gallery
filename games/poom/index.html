<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>품 — 섬마을의 닷새 (데모)</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1c1a17">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#1c1a17;--ink:#f1e9da;--acc:#e07b4f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',sans-serif;display:flex;justify-content:center;min-height:100vh;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
#wrap{width:100%;max-width:920px;padding:12px}
#hud{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:.9rem;padding:6px 2px;min-height:38px}
#hud b{color:var(--acc)}
#mu{border:1px solid #6b6253;background:#2a2622;color:#f1e9da;border-radius:999px;padding:5px 10px;font:inherit;font-size:.82rem;cursor:pointer}
#nb{margin-left:auto;border:1px solid #6b6253;background:#2a2622;color:var(--ink);border-radius:999px;padding:5px 12px;font:inherit;font-size:.82rem;cursor:pointer}
#stage{position:relative;width:100%;aspect-ratio:16/10;border-radius:14px;overflow:hidden;box-shadow:0 10px 40px #0008;background:#000}
canvas{width:100%;height:100%;display:block;touch-action:none}
.ov{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#000a;padding:16px}
.hide{display:none!important}
.box{max-width:580px;width:100%;font-size:16px;background:#f6efe0;color:#2b2620;border-radius:14px;padding:22px 24px;font-family:'Gowun Batang',serif;line-height:1.85;white-space:pre-line;max-height:100%;overflow:auto}
.box.dark{background:#141311;color:#efe7d8;border:1px solid #444}
.box h2{margin:.1em 0 .4em;color:#b5482e;line-height:1.4}
.box.dark h2{color:#e9b38f}
.box h3{margin:1.1em 0 .2em;font-size:1rem;color:#e9b38f;font-family:'Noto Sans KR'}
.box ul{margin:.2em 0;padding-left:1.2em;white-space:normal}
.box li{margin:.25em 0}
.box li.no{color:#6f675c;list-style:'·  '}
.btn{font-family:'Noto Sans KR',sans-serif;margin:14px 6px 0 0;border:0;background:#b5482e;color:#fff;padding:10px 20px;border-radius:999px;font-size:.95rem;cursor:pointer}
.btn.alt{background:#3d6b73}.btn:disabled{background:#8a8378;cursor:default}
.note{font-size:.8rem;color:#a99f8f;border-top:1px solid #444;margin-top:14px;padding-top:10px;font-family:'Noto Sans KR';white-space:normal}
#hint{font-size:.8rem;color:#b7ab97;padding:8px 2px}
#rot{display:none;background:#e07b4f22;border:1px solid #e07b4f66;border-radius:10px;padding:8px 12px;margin:6px 0;font-size:.85rem}
#act{position:absolute;right:10px;bottom:10px;z-index:5;touch-action:manipulation;border:0;border-radius:999px;padding:13px 20px;background:#e07b4fee;color:#fff;font-size:1.02rem;font-weight:600;display:none;cursor:pointer;box-shadow:0 4px 14px #0006}
#cap{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:4;background:#000a;color:#fff;border-radius:999px;padding:6px 16px;font-size:.88rem;max-width:92%;text-align:center;pointer-events:none}
#dlg{position:absolute;left:8px;right:8px;bottom:8px;z-index:6;background:#fbf5e8f5;color:#2b2620;border-radius:12px;padding:12px 16px;font-family:'Gowun Batang',serif;line-height:1.7;cursor:pointer;border:2px solid #b5482e55;font-size:clamp(.82rem,2.4vw,1.02rem)}
#dlg .who{font-family:'Noto Sans KR';font-weight:600;color:#b5482e;font-size:.85em}
#dlg .go{float:right;font-family:'Noto Sans KR';font-size:.75em;color:#8a7f70}
#toast{position:absolute;left:50%;top:46px;transform:translateX(-50%);z-index:7;background:#3d6b73;color:#fff;border-radius:10px;padding:8px 16px;font-size:.88rem;white-space:nowrap;transition:opacity .4s;opacity:0;pointer-events:none}
.word{display:flex;gap:10px;border-bottom:1px dashed #cbbfa8;padding:6px 0;white-space:normal}
.word b{min-width:7.5em;color:#b5482e}
@media (max-width:700px) and (orientation:portrait){#rot{display:block}#wrap{padding:8px}#hint{font-size:.75rem}#act{font-size:.8rem;padding:8px 12px;right:6px;bottom:6px}#hud{font-size:.8rem;gap:9px}}
@media (orientation:landscape) and (max-height:520px){#wrap{max-width:none;padding:4px;display:flex;flex-direction:column;align-items:center;height:100dvh}
 #hud{font-size:.8rem;padding:2px;min-height:30px;width:100%;justify-content:center}#nb{margin-left:8px}#hint,#rot{display:none}#stage{height:calc(100dvh - 38px);width:auto;max-width:100%;border-radius:8px}}
</style>
</head>
<body>
<div id="wrap">
 <div id="hud"></div>
 <div id="rot">📱 휴대폰을 <b>가로로</b> 돌리면 화면 가득 크게 보여요. 이웃이나 집을 <b>톡 누르면</b> 걸어가서 바로 일해요.</div>
 <div id="stage">
  <canvas id="c" role="img" aria-label="섬마을 지도. 이웃 네 명의 집과 우리 집, 밭이 있다."></canvas>
  <div id="cap" class="hide" role="status" aria-live="polite"></div>
  <div id="toast"></div>
  <button id="act"></button>
  <div id="dlg" class="hide" role="status" aria-live="polite" tabindex="0"></div>
 </div>
 <div id="hint">이동: 방향키·WASD 또는 화면 터치 · 행동: 스페이스바·버튼, 또는 대상을 톡 누르기 · 하루 일을 마치면 우리 집으로 돌아갑니다</div>
</div>
<div class="ov hide" id="ov"><div class="box" id="box"></div></div>
<script src="engine.js"></script>
<script src="scenarios/jeju.js"></script>
<script src="scenarios/oki.js"></script>
<script src="scenarios/tw.js"></script>
<script>
/* 오프라인 지원: GitHub Pages처럼 서비스 워커가 허용되는 주소에서만 켠다 */
try{if('serviceWorker' in navigator&&/github\.io$|^localhost$/.test(location.hostname)){OFF=true;navigator.serviceWorker.register('sw.js').catch(()=>{OFF=false})}}catch(e){}
POOM.boot();
</script>
</body>
</html>
