jeju:{key:'jeju',year:'1948년 가을',me:{c:'#a8683c',b:'#5a4636'},
 intro:"1948년 가을, 한라산 자락의 작은 마을.\n당신은 열네 살입니다.\n\n억새가 하얗게 피었고, 닷새 뒤 큰 바람이 온다고 합니다.\n우리 집 초가지붕은 낡았습니다. 혼자서는 새로 이을 수 없습니다.\n\n이 마을에서는 품을 주고받습니다.\n내가 먼저 일해 주면, 그 사람이 내 일에 와 줍니다.",
 days:["첫날.\n하루에 할 수 있는 일은 세 가지.\n이웃 일을 거들면 양식을 나눠 먹게 되고, 우리 밭을 매면 양식이 늘어난다.\n일을 거들 때마다 이웃은 이야기를 하나씩 들려준다.",

 rev:`<h2>이 마을은 지어낸 마을입니다.<br>그러나 이런 마을은 실제로 있었습니다.</h2>1948년 가을부터 이듬해 봄까지, 제주 4·3의 한가운데에서 한라산 중산간 마을 대부분이 불탔습니다. 해안에서 5km 넘게 들어간 곳을 다니면 안 된다는 포고가 나온 뒤의 일입니다. 정부 진상조사보고서는 4·3으로 숨진 사람을 2만 5천에서 3만 명으로 추정합니다.

 words:{sn:['수눌음','이웃끼리 차례로 품을 주고받는 제주의 관행. 육지의 품앗이.'],sc:['삼춘','남녀 가리지 않고 동네 어른을 부르는 말.'],mh:['물허벅','물을 길어 등에 지고 나르는 항아리.'],ol:['올레','큰길에서 집 마당까지 이어지는 좁은 돌담길.'],tw:['테우리','소나 말을 돌보는 목동.'],sa:['성안','제주 읍내를 이르던 말.']}},
